<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" font-family="Georgia, 'Times New Roman', serif">
  <rect width="600" height="800" fill="#eef2f4" stroke="#1f4e5a" stroke-width="6"/>
  <rect x="14" y="14" width="572" height="772" fill="none" stroke="#1f4e5a" stroke-width="1.5"/>

  <!-- PLACEHOLDER banner -->
  <rect x="0" y="0" width="600" height="34" fill="#2e7d32"/>
  <text x="300" y="23" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold" letter-spacing="2">PLACEHOLDER — NOT A REAL LABEL — malt beverage APPROVE case</text>

  <!-- Brand -->
  <text x="300" y="150" text-anchor="middle" fill="#10303a" font-size="46" font-weight="bold" letter-spacing="3">GRANITE PEAK</text>

  <!-- Class / Type -->
  <text x="300" y="220" text-anchor="middle" fill="#244e5a" font-size="24" font-style="italic">India Pale Ale</text>

  <line x1="120" y1="270" x2="480" y2="270" stroke="#1f4e5a" stroke-width="1"/>

  <!-- Alcohol content + Net contents -->
  <text x="300" y="315" text-anchor="middle" fill="#10303a" font-size="24" font-weight="bold">6.7% Alc./Vol.</text>
  <text x="300" y="350" text-anchor="middle" fill="#10303a" font-size="20">12 FL OZ</text>

  <line x1="120" y1="390" x2="480" y2="390" stroke="#1f4e5a" stroke-width="1"/>

  <!-- Government warning: prefix ALL-CAPS + BOLD; remainder regular -->
  <text x="60" y="470" fill="#1a1a1a" font-size="15" font-family="Arial, Helvetica, sans-serif">
    <tspan font-weight="bold">GOVERNMENT WARNING:</tspan><tspan font-weight="normal"> (1) According to the</tspan>
  </text>
  <text x="60" y="494" fill="#1a1a1a" font-size="15" font-weight="normal" font-family="Arial, Helvetica, sans-serif">Surgeon General, women should not drink alcoholic</text>
  <text x="60" y="518" fill="#1a1a1a" font-size="15" font-weight="normal" font-family="Arial, Helvetica, sans-serif">beverages during pregnancy because of the risk of</text>
  <text x="60" y="542" fill="#1a1a1a" font-size="15" font-weight="normal" font-family="Arial, Helvetica, sans-serif">birth defects. (2) Consumption of alcoholic beverages</text>
  <text x="60" y="566" fill="#1a1a1a" font-size="15" font-weight="normal" font-family="Arial, Helvetica, sans-serif">impairs your ability to drive a car or operate machinery,</text>
  <text x="60" y="590" fill="#1a1a1a" font-size="15" font-weight="normal" font-family="Arial, Helvetica, sans-serif">and may cause health problems.</text>

  <text x="300" y="715" text-anchor="middle" fill="#1f4e5a" font-size="13" font-style="italic">Hermetic fixture stub — replace with a real image per MANIFEST.md</text>
  <text x="300" y="740" text-anchor="middle" fill="#1f4e5a" font-size="12">imageFilename: granite-peak-ipa-clean.svg</text>
</svg>
