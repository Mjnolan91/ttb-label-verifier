<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" font-family="Georgia, 'Times New Roman', serif">
  <rect width="600" height="800" fill="#f3eef4" stroke="#6b2d5b" stroke-width="6"/>
  <rect x="14" y="14" width="572" height="772" fill="none" stroke="#6b2d5b" stroke-width="1.5"/>

  <!-- PLACEHOLDER banner -->
  <rect x="0" y="0" width="600" height="34" fill="#2e7d32"/>
  <text x="300" y="23" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold" letter-spacing="2">PLACEHOLDER — NOT A REAL LABEL — wine ≤14% APPROVE case</text>

  <!-- Brand -->
  <text x="300" y="150" text-anchor="middle" fill="#3a1230" font-size="52" font-weight="bold" letter-spacing="4">MARISOL</text>

  <!-- Class / Type -->
  <text x="300" y="225" text-anchor="middle" fill="#5a3450" font-size="24" font-style="italic">Table Wine</text>
  <text x="300" y="260" text-anchor="middle" fill="#5a3450" font-size="18">Sonoma County</text>

  <line x1="120" y1="300" x2="480" y2="300" stroke="#6b2d5b" stroke-width="1"/>

  <!-- Alcohol content + Net contents -->
  <text x="300" y="345" text-anchor="middle" fill="#3a1230" font-size="24" font-weight="bold">13.5% Alc./Vol.</text>
  <text x="300" y="380" text-anchor="middle" fill="#3a1230" font-size="20">750 mL</text>
  <text x="300" y="412" text-anchor="middle" fill="#5a3450" font-size="16">Contains Sulfites</text>

  <line x1="120" y1="448" x2="480" y2="448" stroke="#6b2d5b" stroke-width="1"/>

  <!-- Government warning: prefix ALL-CAPS + BOLD; remainder regular -->
  <text x="60" y="515" fill="#1a1a1a" font-size="15" font-family="Arial, Helvetica, sans-serif">
    <tspan font-weight="bold">GOVERNMENT WARNING:</tspan><tspan font-weight="normal"> (1) According to the</tspan>
  </text>
  <text x="60" y="539" fill="#1a1a1a" font-size="15" font-weight="normal" font-family="Arial, Helvetica, sans-serif">Surgeon General, women should not drink alcoholic</text>
  <text x="60" y="563" fill="#1a1a1a" font-size="15" font-weight="normal" font-family="Arial, Helvetica, sans-serif">beverages during pregnancy because of the risk of</text>
  <text x="60" y="587" fill="#1a1a1a" font-size="15" font-weight="normal" font-family="Arial, Helvetica, sans-serif">birth defects. (2) Consumption of alcoholic beverages</text>
  <text x="60" y="611" fill="#1a1a1a" font-size="15" font-weight="normal" font-family="Arial, Helvetica, sans-serif">impairs your ability to drive a car or operate machinery,</text>
  <text x="60" y="635" fill="#1a1a1a" font-size="15" font-weight="normal" font-family="Arial, Helvetica, sans-serif">and may cause health problems.</text>

  <text x="300" y="715" text-anchor="middle" fill="#6b2d5b" font-size="13" font-style="italic">Hermetic fixture stub — replace with a real image per MANIFEST.md</text>
  <text x="300" y="740" text-anchor="middle" fill="#6b2d5b" font-size="12">imageFilename: marisol-table-wine-clean.svg</text>
</svg>
