<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" font-family="Georgia, 'Times New Roman', serif">
  <rect width="600" height="800" fill="#f6efe2" stroke="#8a6d3b" stroke-width="6"/>
  <rect x="14" y="14" width="572" height="772" fill="none" stroke="#8a6d3b" stroke-width="1.5"/>

  <!-- PLACEHOLDER banner -->
  <rect x="0" y="0" width="600" height="34" fill="#b03a2e"/>
  <text x="300" y="23" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold" letter-spacing="2">PLACEHOLDER — NOT A REAL LABEL — clean PASS case</text>

  <!-- Brand -->
  <text x="300" y="150" text-anchor="middle" fill="#3a2c12" font-size="46" font-weight="bold" letter-spacing="3">OLD TOM</text>
  <text x="300" y="200" text-anchor="middle" fill="#3a2c12" font-size="40" font-weight="bold" letter-spacing="6">DISTILLERY</text>

  <!-- Class / Type -->
  <text x="300" y="270" text-anchor="middle" fill="#5a4423" font-size="22" font-style="italic">Kentucky Straight</text>
  <text x="300" y="300" text-anchor="middle" fill="#5a4423" font-size="22" font-style="italic">Bourbon Whiskey</text>

  <line x1="120" y1="340" x2="480" y2="340" stroke="#8a6d3b" stroke-width="1"/>

  <!-- Alcohol content + Net contents -->
  <text x="300" y="385" text-anchor="middle" fill="#3a2c12" font-size="24" font-weight="bold">45% Alc./Vol. (90 Proof)</text>
  <text x="300" y="420" text-anchor="middle" fill="#3a2c12" font-size="20">750 mL</text>

  <line x1="120" y1="455" x2="480" y2="455" stroke="#8a6d3b" stroke-width="1"/>

  <!-- Government warning: prefix ALL-CAPS + BOLD; remainder regular -->
  <text x="60" y="520" fill="#1a1a1a" font-size="15" font-family="Arial, Helvetica, sans-serif">
    <tspan font-weight="bold">GOVERNMENT WARNING:</tspan><tspan font-weight="normal"> (1) According to the</tspan>
  </text>
  <text x="60" y="544" fill="#1a1a1a" font-size="15" font-weight="normal" font-family="Arial, Helvetica, sans-serif">Surgeon General, women should not drink alcoholic</text>
  <text x="60" y="568" fill="#1a1a1a" font-size="15" font-weight="normal" font-family="Arial, Helvetica, sans-serif">beverages during pregnancy because of the risk of</text>
  <text x="60" y="592" fill="#1a1a1a" font-size="15" font-weight="normal" font-family="Arial, Helvetica, sans-serif">birth defects. (2) Consumption of alcoholic beverages</text>
  <text x="60" y="616" fill="#1a1a1a" font-size="15" font-weight="normal" font-family="Arial, Helvetica, sans-serif">impairs your ability to drive a car or operate machinery,</text>
  <text x="60" y="640" fill="#1a1a1a" font-size="15" font-weight="normal" font-family="Arial, Helvetica, sans-serif">and may cause health problems.</text>

  <text x="300" y="720" text-anchor="middle" fill="#8a6d3b" font-size="13" font-style="italic">Hermetic fixture stub — replace with a real image per MANIFEST.md</text>
  <text x="300" y="745" text-anchor="middle" fill="#8a6d3b" font-size="12">imageFilename: old-tom-bourbon-clean.svg</text>
